[package]
name = "horse-stacker-rust-winit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Keep the showcase on one auditable Flight snapshot while the Rust/TS parity work lands.
flight-sdk = { git = "https://github.com/flighthq/flight.git", rev = "9e8325c93cc9bd0aeef2924ad047a8eb93020e32", default-features = false, features = ["gl"] }
glow = "=0.18.0"
glutin = "=0.32.3"
glutin-winit = "=0.5.0"
raw-window-handle = "=0.6.2"
winit = "=0.30.13"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
