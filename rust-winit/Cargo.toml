[package]
name = "horse-stacker-rust-winit"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["native"]
# Keep the rules usable by fast, renderer-free tests. The native showcase turns on Flight's GL
# lane and the window-system crates, while future headless tools can opt into Flight physics only.
flight-physics = ["dep:flight-sdk"]
native = [
  "flight-physics",
  "flight-sdk/gl",
  "dep:glow",
  "dep:glutin",
  "dep:glutin-winit",
  "dep:raw-window-handle",
  "dep:winit",
]

[[bin]]
name = "horse-stacker-rust-winit"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
# Keep the showcase on one auditable Flight snapshot while the Rust/TS parity work lands.
flight-sdk = { git = "https://github.com/flighthq/flight.git", rev = "9e8325c93cc9bd0aeef2924ad047a8eb93020e32", default-features = false, optional = true }
glow = { version = "=0.18.0", optional = true }
glutin = { version = "=0.32.3", optional = true }
glutin-winit = { version = "=0.5.0", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
winit = { version = "=0.30.13", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
